<!doctype html><html><head><meta charset="utf-8"><title>XOFO - EdInsight HTML UI Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:none;width:100%;height:100%;border:0}iframe.active{display:block}</style></head><body><iframe id="p1" src="page1.html"></iframe><iframe id="p2" src="page2.html"></iframe><iframe id="p3" src="page3.html"></iframe><script>let current=1;function goPage(n,writeHash=true){n=Math.max(1,Math.min(3,Number(n)||1));current=n;document.querySelectorAll('iframe').forEach((x,i)=>x.classList.toggle('active',i===n-1));if(writeHash&&location.hash!=='#page'+n)history.pushState(null,'','#page'+n)}function sync(){const m=location.hash.match(/page([1-3])/i);goPage(m?Number(m[1]):1,false)}window.addEventListener('hashchange',sync);window.addEventListener('popstate',sync);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goPage(current+1);if(e.key==='ArrowLeft')goPage(current-1);if(/^[1-3]$/.test(e.key))goPage(Number(e.key))});sync();</script></body></html>
